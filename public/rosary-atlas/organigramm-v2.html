<script>
(function () {
  const DESC = {
    COCKPIT: "L1 Orchestrierung — zentrales Cockpit des Agenten-Netzes.",
    "SYNC-MASTER": "Hermes Multi-PC Sync Master (L2) · GrokSyncMaster GSM v4.",
    COS: "Hermes-Bot Chief of Staff.",
    RSY: "Hermes-Bot Rosary.",
    "EX-01": "Exzellenz EX-01.",
    "EX-02": "Exzellenz EX-02.",
    "EX-03": "Exzellenz EX-03.",
    "EX-04": "Exzellenz EX-04.",
    "DIR-01": "Dirigent DIR-01.",
    "DIR-02": "Dirigent DIR-02.",
    "SC-01": "Scout SC-01.",
    "SC-02": "Scout SC-02.",
    "SC-03": "Scout SC-03.",
    "SC-04": "Scout SC-04.",
    "SC-05": "Scout SC-05.",
    "SC-06": "Sicherheits-Scout: Ablaufdaten und Sicherheitswarnungen (keine Geheimnisse im Wallpaper).",
    "SC-07": "Scout SC-07.",
    MAPS: "Karten-Cluster (3 Knoten).",
    WIKI: "Wiki-Cluster (2 Knoten).",
    MANUAL: "Manueller Trigger — startet einen Sync-/Animationsdurchlauf (auch Taste T).",
    AUTO: "Automatischer Trigger — alle 60 s Puls, Umschalter an/aus.",
    "PC-1": "Heimnetz-Rechner PC-1.",
    "PC-2": "Heimnetz-Rechner PC-2.",
    "PC-3": "Heimnetz-Rechner PC-3.",
    "PC-4": "Heimnetz-Rechner PC-4.",
    "GB-RDIR": "Grok Regiedirektor — zentraler Koordinator / Chief of Staff.",
    "GB-REGIE": "Regie — Team-Koordination und Übergaben.",
    "GB-ARCHY": "ARCHY — Bildung und Verkündigung, Quellen.",
    "GB-FIDELIO": "Fidelio — Barde, Musik und Text.",
    "GB-DATEN": "Daten-Scout — Datenanalysen, Agent-Search.",
    "GB-BUECHER": "Bücher-Scout — Lese-Impulse.",
    "GB-DOC": "DOC — Health & Longevity, Koordinator MediTeam.",
    "MT-ERN": "MediTeam Ernährung.",
    "MT-BEW": "MediTeam Bewegung & Gelenke.",
    "MT-SCHLAF": "MediTeam Schlaf.",
    "MT-EVI": "MediTeam Evidenzprüfer."
  };

  const EMBEDDED_ONLY = true;
  const httpMode = false; // öffentliche Seite: nur eingebettete Daten, kein Fetch, kein lokaler Server
  const STATE_FILES = [];
  const knownIds = [...document.querySelectorAll("[data-node]")].map(e => e.dataset.node);

  function defaultNode() { return { status: "awake", note: "", updatedAt: 0, by: "" }; }

  function loadEmbedded() {
    try { return JSON.parse(document.getElementById("embedded-state").textContent); }
    catch (e) { return { version: 2, nodes: {}, tasks: [], rules: [] }; }
  }

  function ensureNodes(state) {
    state.nodes = state.nodes || {};
    knownIds.forEach(id => {
      if (!state.nodes[id]) state.nodes[id] = defaultNode();
      if (!state.nodes[id].status) state.nodes[id].status = "awake";
    });
    return state;
  }

  function merge(a, b) {
    const out = { version: 2, nodes: { ...(a.nodes || {}) }, tasks: a.tasks || [], rules: a.rules || [] };
    for (const [k, v] of Object.entries(b.nodes || {})) {
      if (!out.nodes[k] || (v.updatedAt || 0) >= (out.nodes[k].updatedAt || 0)) out.nodes[k] = v;
    }
    return ensureNodes(out);
  }

  let state = ensureNodes(loadEmbedded());
  let autoOn = true;
  let lastRunAt = null;
  let roleTimer = null;
  const fmt = new Intl.DateTimeFormat("de-DE", { dateStyle: "short", timeStyle: "medium", timeZone: "Europe/Berlin" });

  function isAwake(id) {
    const n = state.nodes[id];
    return !n || n.status === "awake";
  }

  function render() {
    document.querySelectorAll("[data-node]").forEach(g => {
      const id = g.dataset.node;
      const awake = isAwake(id);
      g.classList.toggle("awake", awake);
      g.classList.toggle("sleeping", !awake);
      g.querySelectorAll("text.stxt").forEach(t => {
        const raw = t.textContent.replace(/^(AWAKE|SLEEPING|SLEEP|SYNC)/, "");
        t.textContent = (awake ? "AWAKE" : "SLEEPING") + (raw && !/^(AWAKE|SLEEPING)/.test(t.textContent) ? raw : "");
        if (/^(AWAKE|SLEEPING)/.test(t.textContent) || t.classList.contains("stxt")) {
          t.textContent = awake ? "AWAKE" : "SLEEPING";
          t.setAttribute("fill", awake ? "#34d399" : "#64748b");
        }
      });
    });
    const sub = document.getElementById("autoSub");
    if (sub) sub.textContent = autoOn ? "AN • alle 60 s" : "AUS";
    const rect = document.getElementById("autoRect");
    if (rect) rect.setAttribute("stroke", autoOn ? "#a78bfa" : "#475569");
  }

  function setLastRun(d) {
    lastRunAt = d;
    const text = d ? fmt.format(d) : "–";
    const el = document.getElementById("lastRun");
    if (el) el.textContent = text;
    const svg = document.getElementById("lastRunSvg");
    if (svg) svg.textContent = text;
  }

  function showRole(id) {
    const n = state.nodes[id] || defaultNode();
    const card = document.getElementById("roleCard");
    document.getElementById("roleId").textContent = id;
    const st = n.status === "awake" ? "AWAKE" : "SLEEPING";
    const cls = n.status === "awake" ? "st-awake" : "st-sleeping";
    const when = n.updatedAt ? " · zuletzt " + fmt.format(new Date(n.updatedAt)) + (n.by ? " von " + n.by : "") : "";
    document.getElementById("roleMeta").innerHTML = 'Status: <span class="' + cls + '">' + st + "</span>" + when;
    document.getElementById("roleText").textContent = DESC[id] || n.note || "Rolle nicht hinterlegt.";
    card.style.display = "block";
    clearTimeout(roleTimer);
    roleTimer = setTimeout(() => { card.style.display = "none"; }, 6000);
  }

  function pulseAlong(path, delay, color) {
    const svg = path.ownerSVGElement;
    const ns = "http://www.w3.org/2000/svg";
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("r", "5");
    dot.setAttribute("fill", color || "#fbbf24");
    dot.setAttribute("filter", "url(#glowGold)");
    dot.setAttribute("pointer-events", "none");
    svg.querySelector("#pulsePaths").appendChild(dot);
    const len = path.getTotalLength();
    const dur = 900;
    setTimeout(() => {
      const t0 = performance.now();
      (function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const pt = path.getPointAtLength(p * len);
        dot.setAttribute("cx", pt.x);
        dot.setAttribute("cy", pt.y);
        dot.setAttribute("opacity", String(1 - p * 0.15));
        if (p < 1) requestAnimationFrame(step);
        else dot.remove();
      })(t0);
    }, delay);
  }

  function ripple() {
    const c = document.getElementById("cockpitRipple");
    if (!c) return;
    c.setAttribute("r", "56");
    c.setAttribute("opacity", "0.9");
    const t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / 1000);
      c.setAttribute("r", String(56 + p * 80));
      c.setAttribute("opacity", String(0.9 * (1 - p)));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function flashGroups() {
    document.querySelectorAll("[data-node]").forEach((g, i) => {
      setTimeout(() => {
        g.classList.add("hit");
        setTimeout(() => g.classList.remove("hit"), 500);
      }, 400 + (i % 8) * 40);
    });
  }

  function runPulse() {
    setLastRun(new Date());
    ripple();
    const colors = { "p-sync": "#22d3ee", "p-ex": "#fbbf24", "p-dir": "#14b8a6", "p-koord": "#d4af37", "p-scouts": "#f472b6", "p-maps": "#14b8a6", "p-wiki": "#a78bfa", "p-medi": "#2dd4bf", "p-trig": "#34d399" };
    let i = 0;
    document.querySelectorAll("#pulsePaths path").forEach(path => {
      pulseAlong(path, i * 70, colors[path.id] || "#fbbf24");
      i += 1;
    });
    flashGroups();
  }

  async function poll() {
    if (!httpMode) return false;
    for (const file of STATE_FILES) {
      try {
        const res = await fetch(file, { cache: "no-store" });
        if (!res.ok) continue;
        const incoming = await res.json();
        state = merge(state, incoming);
        render();
        const live = document.getElementById("liveLabel");
        live.textContent = "LIVE • HTTP-Sync • " + fmt.format(new Date());
        return true;
      } catch (e) { /* nächste Datei bzw. Fallback */ }
    }
    return false;
  }

  function toggleAuto() {
    autoOn = !autoOn;
    render();
  }

  document.getElementById("btnManual").addEventListener("click", ev => {
    ev.stopPropagation();
    runPulse();
    showRole("MANUAL");
  });
  document.getElementById("btnAuto").addEventListener("click", ev => {
    ev.stopPropagation();
    toggleAuto();
    showRole("AUTO");
  });
  document.querySelectorAll("[data-node]").forEach(g => {
    if (g.id === "btnManual" || g.id === "btnAuto") return;
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      showRole(g.dataset.node);
    });
  });
  document.addEventListener("keydown", ev => {
    if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    if (ev.key === "t" || ev.key === "T") { ev.preventDefault(); runPulse(); }
    if (ev.key === "Escape") document.getElementById("roleCard").style.display = "none";
    if (ev.key === "f" || ev.key === "F") toggleFs();
  });
  document.addEventListener("click", () => { document.getElementById("roleCard").style.display = "none"; });

  function toggleFs() {
    const el = document.querySelector(".stage") || document.documentElement;
    if (!document.fullscreenElement) el.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  document.getElementById("btnFs").addEventListener("click", ev => { ev.stopPropagation(); toggleFs(); });

  render();
  poll().then(ok => {
    if (!httpMode) {
      document.getElementById("liveLabel").textContent = "LIVE • eingebettete Daten • Auto-Puls 60 s";
    } else if (!ok) {
      document.getElementById("liveLabel").textContent = "LIVE • Fallback eingebettet • warte auf State";
    }
  });

  setInterval(async () => {
    await poll();
    if (autoOn) runPulse();
  }, 60000);
})();
</script>
</body>
</html>
