<!-- ROSARY-ATLAS Vault-Graph-Widget · Stand 27.11.2026 (Europe/Berlin).
     Iframe-tauglich, volle Breite, ohne horizontales Scrollen.
     Auslieferung: monitor.rosenkranz.eu.com/rosary-atlas/vault-graph-widget.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ROSARY-ATLAS • Vault-Graph-Widget</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #111827;
      --accent: #22d3ee;
      --green: #34d399;
      --gold: #d4af37;
      --dim: #475569;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      max-width: 100%;
      overflow: hidden;
      background: #020617;
      color: #e2e8f0;
      font-family: "IBM Plex Mono", "Cascadia Code", "DejaVu Sans Mono", "Consolas", "Liberation Mono", monospace;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .monitor-header {
      flex: 0 0 auto;
      background: linear-gradient(to right, #1e293b, #0f172a);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #334155;
      min-height: 48px;
    }
    .monitor-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .monitor-title .logo {
      width: 26px; height: 26px; flex: 0 0 26px;
      background: #22d3ee; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #020617;
    }
    .monitor-title h1 {
      font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .monitor-title .url {
      font-size: 11px; color: #64748b;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .monitor-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: #94a3b8; flex: 0 0 auto;
    }
    .status-dot {
      width: 8px; height: 8px; background: #34d399; border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }
    .frame {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #1A1611;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      max-width: 100%;
    }
    @media (max-width: 420px) {
      .monitor-header { padding: 6px 10px; min-height: 44px; }
      .monitor-title h1 { font-size: 13px; }
      .monitor-title .url { display: none; }
      .monitor-status span { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="monitor-header">
      <div class="monitor-title">
        <div class="logo" aria-hidden="true">◈</div>
        <div style="min-width:0">
          <h1>ROSARY-ATLAS • Vault-Graph</h1>
          <div class="url">monitor.rosenkranz.eu.com/rosary-atlas/vault-graph-widget.html</div>
        </div>
      </div>
      <div class="monitor-status">
        <div class="status-dot" aria-hidden="true"></div>
        <span>Stand 27.11.2026</span>
      </div>
    </header>
    <div class="frame">
      <iframe
        src="./vault-graph.html?widget=1"
        title="ROSARY-ATLAS interaktiver Vault-Graph"
        loading="eager"
        referrerpolicy="no-referrer">
      </iframe>
    </div>
  </div>
</body>
</html>
